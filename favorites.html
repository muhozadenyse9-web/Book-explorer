<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer - Favorites</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Same Navigation Bar -->
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">📚 Book Explorer</h1>
            <ul class="flex space-x-6">
                <li><a href="index.html" class="hover:text-yellow-300 transition">Home</a></li>
                <li><a href="favorites.html" class="hover:text-yellow-300 transition">Favorites</a></li>
                <li><a href="about.html" class="hover:text-yellow-300 transition">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Favorites Hero -->
    <section class="bg-purple-600 text-white py-12">
        <div class="container mx-auto text-center px-4">
            <h2 class="text-3xl md:text-4xl font-bold mb-2">Your Favorite Books</h2>
            <p class="text-xl">Books you've saved for later reading</p>
        </div>
    </section>

    <!-- Favorites Grid -->
    <main class="container mx-auto px-4 py-12">
        <!-- Empty state message -->
        <div class="text-center py-12">
            <p class="text-xl text-gray-600 mb-4">You haven't added any favorites yet.</p>
            <a href="index.html" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition inline-block">Browse Books</a>
        </div>
        
        <!-- Grid (hidden for now, will be shown in Lab 2) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Favorites will appear here later -->
        </div>
    </main>

    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="container mx-auto text-center">
            <p>&copy; 2024 Book Explorer. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
