<!DOCTYPE html>
<!-- Declares this as an HTML5 document -->
<html lang="en">
<!-- Sets the language to English for accessibility and SEO -->

<head>
    <!-- HEAD section contains metadata and links that don't display directly -->
    <meta charset="UTF-8">
    <!-- Specifies character encoding to support all special characters -->
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ensures proper responsive behavior on mobile devices -->
    
    <title>Book Explorer - Home</title>
    <!-- Sets the title that appears in browser tab -->
    
    <!-- Tailwind CSS CDN - Content Delivery Network -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Imports Tailwind CSS framework to use utility classes for styling -->
    <!-- CDN delivers the file quickly from servers worldwide -->
</head>

<body class="bg-gray-50 font-sans">
    <!-- BODY contains all visible content -->
    <!-- bg-gray-50: light gray background -->
    <!-- font-sans: uses system sans-serif font for clean readability -->

    <!-- ========== NAVIGATION BAR ========== -->
    <!-- Exercise 1.1: Homepage Layout - Navbar component -->
    <nav class="bg-blue-600 text-white p-4 shadow-lg">
        <!-- nav: semantic HTML5 tag for navigation section -->
        <!-- bg-blue-600: blue background shade 600 (medium blue) -->
        <!-- text-white: white text color -->
        <!-- p-4: padding of 1rem (16px) on all sides -->
        <!-- shadow-lg: large drop shadow for depth -->
        
        <div class="container mx-auto flex justify-between items-center">
            <!-- container: centers content with max-width -->
            <!-- mx-auto: auto margins for horizontal centering -->
            <!-- flex: enables flexbox layout -->
            <!-- justify-between: pushes items to left and right edges -->
            <!-- items-center: vertically centers items -->
            
            <h1 class="text-2xl font-bold">📚 Book Explorer</h1>
            <!-- text-2xl: extra large text (1.5rem) -->
            <!-- font-bold: bold font weight -->
            <!-- 📚: book emoji as visual brand element -->
            
            <ul class="flex space-x-6">
                <!-- ul: unordered list for navigation links -->
                <!-- space-x-6: horizontal spacing of 1.5rem between list items -->
                
                <li><a href="index.html" class="hover:text-yellow-300 transition">Home</a></li>
                <!-- a: anchor tag for hyperlink -->
                <!-- hover:text-yellow-300: changes to yellow on mouse hover -->
                <!-- transition: smooth animation for hover effects -->
                
                <li><a href="favorites.html" class="hover:text-yellow-300 transition">Favorites</a></li>
                <!-- Links to favorites page -->
                
                <li><a href="about.html" class="hover:text-yellow-300 transition">About</a></li>
                <!-- Links to about page -->
            </ul>
        </div>
    </nav>

    <!-- ========== HERO SECTION ========== -->
    <!-- Exercise 1.1: Homepage Layout - Hero component -->
    <section class="bg-gradient-to-r from-blue-500 to-purple-600 text-white py-20">
        <!-- section: semantic tag for thematic content grouping -->
        <!-- bg-gradient-to-r: horizontal gradient background -->
        <!-- from-blue-500 to-purple-600: gradient from blue to purple -->
        <!-- py-20: vertical padding of 5rem (80px) top and bottom -->
        
        <div class="container mx-auto text-center px-4">
            <!-- text-center: centers text horizontally -->
            <!-- px-4: horizontal padding of 1rem (16px) left and right -->
            
            <h2 class="text-4xl md:text-5xl font-bold mb-4">Discover Your Next Favorite Book</h2>
            <!-- text-4xl: 2.25rem on mobile, md:text-5xl: 3rem on medium screens and up -->
            <!-- mb-4: margin bottom of 1rem -->
            
            <p class="text-xl mb-8 max-w-2xl mx-auto">Browse thousands of books, search by title, and save your favorites for later.</p>
            <!-- text-xl: 1.25rem font size -->
            <!-- mb-8: margin bottom of 2rem -->
            <!-- max-w-2xl: maximum width of 42rem (672px) -->
            
            <!-- Search Bar - will be functional in Lab 3 -->
            <div class="flex max-w-md mx-auto">
                <!-- flex: enables flexbox for input+button combination -->
                <!-- max-w-md: maximum width of 28rem (448px) -->
                
                <input type="text" id="searchInput" placeholder="Search for books..." 
                       class="flex-1 px-4 py-3 rounded-l-lg text-gray-800 focus:outline-none">
                <!-- input: text input field -->
                <!-- id="searchInput": unique identifier for JavaScript targeting -->
                <!-- flex-1: takes up all available space in flex container -->
                <!-- rounded-l-lg: rounded corners on left side only -->
                <!-- focus:outline-none: removes default focus outline (we'll add custom styling) -->
                
                <button id="searchBtn" class="bg-yellow-400 text-gray-800 px-6 py-3 rounded-r-lg font-semibold hover:bg-yellow-300 transition">
                    Search
                </button>
                <!-- button: clickable button element -->
                <!-- id="searchBtn": unique identifier for JavaScript -->
                <!-- rounded-r-lg: rounded corners on right side only -->
                <!-- font-semibold: semi-bold font weight -->
            </div>
        </div>
    </section>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="container mx-auto px-4 py-12">
        <!-- main: semantic tag for primary content -->
        <!-- py-12: vertical padding of 3rem -->
        
        <h3 class="text-2xl font-bold mb-8">Featured Books</h3>
        <!-- Section heading -->
        
        <!-- ========== LOADING SPINNER ========== -->
        <!-- Exercise 3.4: Feedback & Loading States -->
        <div id="loadingSpinner" class="hidden text-center py-12">
            <!-- id="loadingSpinner": for JavaScript to show/hide -->
            <!-- hidden: Tailwind class that sets display: none (initially hidden) -->
            
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
            <!-- animate-spin: Tailwind animation for spinning -->
            <!-- rounded-full: fully rounded circle -->
            <!-- h-12 w-12: height and width of 3rem -->
            <!-- border-4: 4px border width -->
            <!-- border-t-transparent: top border transparent creates spinning effect -->
            
            <p class="mt-4 text-gray-600">Loading amazing books...</p>
        </div>
        
        <!-- ========== BOOKS GRID ========== -->
        <!-- Exercise 1.2 & 1.3: Responsive Grid and Mobile-First Design -->
        <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- id="booksGrid": for JavaScript to insert book cards -->
            <!-- grid: enables CSS Grid layout -->
            <!-- grid-cols-1: 1 column on mobile -->
            <!-- sm:grid-cols-2: 2 columns on small screens (640px+) -->
            <!-- md:grid-cols-3: 3 columns on medium screens (768px+) -->
            <!-- lg:grid-cols-4: 4 columns on large screens (1024px+) -->
            <!-- gap-6: gap of 1.5rem between grid items -->
            
            <!-- Books will be dynamically inserted here by JavaScript -->
        </div>
        
        <!-- ========== NO RESULTS MESSAGE ========== -->
        <!-- Exercise 3.4: Feedback & Loading States -->
        <div id="noResultsMessage" class="hidden text-center py-12">
            <!-- Hidden by default, shown when search returns no results -->
            <p class="text-xl text-gray-600">No books found. Try a different search!</p>
        </div>
    </main>

    <!-- ========== FOOTER ========== -->
    <!-- Exercise 1.1: Homepage Layout - Footer component -->
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <!-- footer: semantic tag for footer content -->
        <!-- bg-gray-800: dark gray background -->
        <!-- mt-12: margin top of 3rem to separate from content -->
        
        <div class="container mx-auto text-center">
            <p>&copy; 2024 Book Explorer. All rights reserved.</p>
            <!-- &copy;: HTML entity for copyright symbol -->
        </div>
    </footer>

    <!-- ========== JAVASCRIPT MODULES ========== -->
    <script type="module" src="js/main.js"></script>
    <!-- type="module": tells browser to treat as ES6 module -->
    <!-- src: source file location -->
    <!-- This loads our main JavaScript entry point -->
</body>
</html>
